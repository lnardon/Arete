services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: arete
      POSTGRES_PASSWORD: arete
      POSTGRES_DB: arete_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arete -d arete_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: arete
      DB_PASSWORD: arete
      DB_NAME: arete_dev
      DB_SSLMODE: disable
      STATIC_DIR: /app/frontend
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
